<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b52569" />
    <title>Sin conexión — IMAF</title>
    <style>
      /* Página autónoma: sin conexión no se puede cargar `globals.css`.
         Los valores son copia de sus tokens; si cambian allá, cámbialos aquí. */
      :root {
        color-scheme: light dark;
        --background: #faf8f7;
        --foreground: #1a1817;
        --muted-foreground: #5f5b59;
        --primary: #b52569;
        --primary-foreground: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #131313;
          --foreground: #e5e2e1;
          --muted-foreground: #a8a29e;
          --primary: #ffb1c5;
          --primary-foreground: #5c0029;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 26rem;
      }
      img {
        border-radius: 1rem;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted-foreground);
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        padding: 0.625rem 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <h1>Sin conexión a internet</h1>
      <p>
        Esta página necesita conexión para mostrar tu información. Se volverá a
        cargar sola cuando regrese la señal.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
